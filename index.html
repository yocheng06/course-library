:root{color:#14264a;background:#f6f5f1;line-height:1.6}
*,*::before,*::after{box-sizing:border-box}
body{margin:0!important;min-height:100vh;background:#f7f4ee!important;color:#14264a;font-family:"Noto Sans TC",system-ui,-apple-system,"Segoe UI","Microsoft JhengHei",sans-serif}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(50,103,205,.12) 8px,transparent 8px),linear-gradient(rgba(50,103,205,.12) 8px,transparent 8px);background-size:24px 24px;mask-image:radial-gradient(circle at 12% 26%,#000 0 8%,transparent 18%),radial-gradient(circle at 84% 22%,#000 0 9%,transparent 20%),radial-gradient(circle at 93% 88%,#000 0 7%,transparent 16%),radial-gradient(circle at 8% 92%,#000 0 6%,transparent 15%);opacity:.55}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(90deg,#3267cd 0 13px,transparent 13px),linear-gradient(90deg,#157e69 0 13px,transparent 13px),linear-gradient(90deg,#8eb6ee 0 9px,transparent 9px),linear-gradient(90deg,#7ed6c0 0 9px,transparent 9px);background-size:13px 13px,13px 13px,9px 9px,9px 9px;background-position:5% 32%,77% 12%,27% 20%,92% 13%;background-repeat:no-repeat;opacity:.85}
.pixel-page{position:relative;z-index:1;width:min(100% - 64px,1120px);min-height:100svh;margin:0 auto;padding:20px 0;display:flex;flex-direction:column}
.pixel-brand{display:flex;align-items:center;gap:14px;font-size:23px;font-weight:800;letter-spacing:.025em}
.pixel-brand-icon{display:grid;place-items:center;width:48px;height:48px;flex:0 0 auto;background:#3267cd;border-radius:0;clip-path:polygon(8px 0,calc(100% - 8px) 0,calc(100% - 8px) 8px,100% 8px,100% calc(100% - 8px),calc(100% - 8px) calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,8px calc(100% - 8px),0 calc(100% - 8px),0 8px,8px 8px)}
.pixel-brand-icon img{width:30px;height:30px}
.pixel-main{flex:1;display:flex;flex-direction:column;justify-content:center}
.pixel-hero{position:relative;min-height:clamp(196px,25vh,244px);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.8fr) minmax(0,1fr);align-items:center;gap:24px;margin-top:8px;padding:12px 0;text-align:center}
.pixel-hero-copy{position:relative;z-index:1}
.pixel-hero-copy h1{margin:0 0 10px;color:#102044;font-size:clamp(34px,3.4vw,48px);font-weight:850;letter-spacing:.02em;line-height:1.25}
.pixel-hero-copy p{margin:0;color:#4a5d7b;font-size:20px;letter-spacing:.02em}
.pixel-hero-art{width:100%;max-width:290px;max-height:180px;object-fit:contain;filter:drop-shadow(6px 7px 0 rgba(50,103,205,.15))}
.pixel-hero-art.os-art{justify-self:start}
.pixel-hero-art.algo-art{justify-self:end}
.pixel-courses{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:32px;margin-top:16px}
.pixel-course{--accent:#245dca;--tint:#eff5ff;--shadow:#8eafe9;display:flex;position:relative;min-width:0;min-height:316px;flex-direction:column;padding:28px 30px;border:3px solid var(--accent);border-radius:0;background:linear-gradient(135deg,rgba(255,255,255,.58),transparent 34%),var(--tint);box-shadow:8px 8px 0 var(--shadow);clip-path:polygon(14px 0,calc(100% - 14px) 0,calc(100% - 14px) 7px,100% 7px,100% calc(100% - 14px),calc(100% - 7px) calc(100% - 14px),calc(100% - 7px) calc(100% - 7px),calc(100% - 14px) calc(100% - 7px),calc(100% - 14px) 100%,14px 100%,14px calc(100% - 7px),7px calc(100% - 7px),7px calc(100% - 14px),0 calc(100% - 14px),0 14px,7px 14px,7px 7px,14px 7px);color:#14264a;text-decoration:none}
.pixel-course::before{content:"";position:absolute;top:10px;left:12px;width:6px;height:6px;background:var(--accent);box-shadow:8px 0 0 var(--accent),0 8px 0 var(--accent),8px 8px 0 rgba(255,255,255,.82)}
.pixel-course::after{content:"";position:absolute;right:50px;top:92px;width:10px;height:10px;background:rgba(36,93,202,.14);box-shadow:18px 18px 0 rgba(36,93,202,.18),0 36px 0 rgba(36,93,202,.12)}
.pixel-course.algo{--accent:#147d68;--tint:#f0f8f3;--shadow:#9bcdb9}
.pixel-course.algo::after{background:rgba(20,125,104,.12);box-shadow:18px 18px 0 rgba(20,125,104,.16),0 36px 0 rgba(20,125,104,.12)}
.pixel-course:focus-visible{outline:4px solid #15264b;outline-offset:7px}
.pixel-course-heading{display:flex;align-items:center;gap:20px}
.pixel-course-icon{display:grid;place-items:center;width:76px;height:76px;flex:0 0 auto;border:0;border-radius:0;background:#dce9ff;clip-path:polygon(12px 0,calc(100% - 12px) 0,calc(100% - 12px) 6px,100% 6px,100% calc(100% - 12px),calc(100% - 12px) calc(100% - 12px),calc(100% - 12px) 100%,12px 100%,12px calc(100% - 12px),0 calc(100% - 12px),0 12px,12px 12px)}
.pixel-course.algo .pixel-course-icon{background:#d9f0e5}
.pixel-course-icon img{width:44px;height:44px}
.pixel-course-name{min-width:0}
.pixel-course-name h2{margin:0;color:#102044;font-size:34px;font-weight:850;letter-spacing:.04em;line-height:1.3}
.pixel-course-name .en{margin:3px 0 0;color:#435875;font-size:14px;letter-spacing:.12em;line-height:1.5}
.pixel-course-desc{margin:22px 0 14px;color:#354d70;font-size:18px;line-height:1.7}
.pixel-course-tags{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin:0 0 22px}
.pixel-course-tag{padding:4px 12px;background:#dbe9ff;color:#245dca;font-size:16px;font-weight:750;line-height:1.5}
.pixel-course.algo .pixel-course-tag{background:#d9f0e5;color:#147d68}
.pixel-course-separator{color:#263c60;font-size:16px}
.pixel-enter{position:relative;display:flex;align-items:center;justify-content:center;min-height:56px;margin-top:auto;padding:10px 48px;background:linear-gradient(135deg,rgba(255,255,255,.12) 0 16%,transparent 16%),linear-gradient(90deg,rgba(255,255,255,.1) 0 8px,transparent 8px),var(--accent);background-size:auto,16px 16px,auto;box-shadow:5px 5px 0 var(--shadow);color:#fff;font-size:20px;font-weight:850;letter-spacing:.05em}
.pixel-enter img{position:absolute;right:22px;width:26px;height:26px}
.pixel-course:hover .pixel-enter{filter:brightness(.94)}
.pixel-course:hover{transform:translateY(-2px)}
.pixel-course,.pixel-enter{transition:transform .16s ease,filter .16s ease}
.pixel-footer{margin-top:20px;border-top:1px solid #d5d9df;padding:12px 12px 0;color:#4e6382;text-align:center;font-size:16px;letter-spacing:.02em}
@media(prefers-reduced-motion:reduce){.pixel-course,.pixel-enter{transition:none}}
@media(max-width:1050px){.pixel-page{width:min(100% - 48px,920px)}.pixel-hero{grid-template-columns:minmax(0,1fr) minmax(0,3fr) minmax(0,1fr);gap:16px;padding-right:0;padding-left:0}.pixel-hero-art{max-width:150px;max-height:110px}.pixel-hero-copy h1{font-size:32px}.pixel-courses{gap:22px}.pixel-course{padding-right:22px;padding-left:22px}.pixel-course-name h2{font-size:29px}.pixel-course-name .en{font-size:12px}}
@media(min-width:761px) and (max-height:700px){.pixel-page{padding-top:16px;padding-bottom:16px}.pixel-brand-icon{width:44px;height:44px}.pixel-hero{min-height:168px;margin-top:6px;padding-top:8px;padding-bottom:8px}.pixel-hero-art{max-height:140px}.pixel-courses{margin-top:10px}.pixel-course{min-height:300px;padding-top:24px;padding-bottom:24px}.pixel-footer{margin-top:18px;padding-top:10px;font-size:15px}}
@media(max-width:760px){.pixel-page{width:auto;margin:0;padding:20px 20px 18px}.pixel-brand{gap:11px;font-size:21px}.pixel-brand-icon{width:44px;height:44px}.pixel-hero{min-height:0;display:block;margin-top:16px;padding:16px 0 22px}.pixel-hero-art{display:none}.pixel-hero-copy h1{font-size:32px;line-height:1.3}.pixel-hero-copy p{font-size:18px}.pixel-courses{grid-template-columns:1fr;gap:18px;margin-top:0}.pixel-course{min-height:0;padding:22px}.pixel-course-heading{gap:14px}.pixel-course-icon{width:56px;height:56px}.pixel-course-icon img{width:34px;height:34px}.pixel-course-name h2{font-size:28px}.pixel-course-name .en{font-size:12px}.pixel-course-tags{gap:9px;margin-bottom:18px}.pixel-footer{margin-top:24px;padding-top:12px;font-size:14px}}
@media(max-width:380px){.pixel-page{padding-right:15px;padding-left:15px}.pixel-hero-copy h1{font-size:31px}.pixel-course{padding-right:19px;padding-left:19px}.pixel-course-heading{gap:13px}.pixel-course-name h2{font-size:26px}.pixel-course-desc{font-size:15px}}
@media(max-width:760px){body::before{opacity:.35}body::after{display:none}.pixel-main{justify-content:flex-start}.pixel-course-desc{margin:14px 0 10px;font-size:16px}.pixel-course-tag{font-size:14px}.pixel-enter{min-height:52px}}

/* The course entrance uses the same palette as its learning room. */
.pixel-course.algo{--accent:#94506a;--tint:#f6eff2;--shadow:#d5b6c1;color:#292a2f}
.pixel-course.algo .pixel-course-icon{background:#ead8df}
.pixel-course.algo .pixel-course-icon img{filter:grayscale(1) brightness(.55)}
.pixel-course.algo .pixel-course-name h2{color:#292a2f}
.pixel-course.algo .en,.pixel-course.algo .pixel-course-desc{color:#62545e}
.pixel-course.algo .pixel-course-tag{background:#ead8df;color:#85475e}
.pixel-course.algo::after{background:#c79dac66;box-shadow:18px 18px 0 #c79dac55,0 36px 0 #c79dac44}

/* Quiet motion keeps the pixel artwork intact while making the entrance feel alive. */
@keyframes pixel-arrive{from{opacity:0;translate:0 12px}to{opacity:1;translate:0 0}}
@keyframes pixel-float{0%,100%{translate:0 0}50%{translate:0 -7px}}
@keyframes pixel-grid-breathe{from{opacity:.46}to{opacity:.55}}
@keyframes pixel-led-blink{0%,100%{opacity:.42}50%{opacity:.95}}
.pixel-brand{animation:pixel-arrive .55s cubic-bezier(.2,.75,.25,1) both}
.pixel-hero-copy{animation:pixel-arrive .62s .08s cubic-bezier(.2,.75,.25,1) both}
.pixel-hero-art{animation:pixel-float 6.4s ease-in-out infinite}
.pixel-hero-art.os-art{animation-delay:-2.4s}
.pixel-hero-art.algo-art{animation-delay:-.8s}
body::before{animation:pixel-grid-breathe 8s ease-in-out infinite alternate}
.pixel-course{animation:pixel-arrive .62s cubic-bezier(.2,.75,.25,1) both}
.pixel-course.os{animation-delay:.18s}
.pixel-course.algo{animation-delay:.32s}
.pixel-course::after{animation:pixel-led-blink 3.2s steps(2,end) infinite}
.pixel-footer{animation:pixel-arrive .55s .42s cubic-bezier(.2,.75,.25,1) both}
.pixel-course,.pixel-enter{transition:transform .24s cubic-bezier(.2,.75,.25,1),box-shadow .24s ease,filter .24s ease}
.pixel-course:hover{transform:translateY(-5px);box-shadow:10px 10px 0 var(--shadow)}
.pixel-course:active{transform:translateY(-1px)}
.pixel-enter{overflow:hidden}
.pixel-enter::before{content:"";position:absolute;top:0;bottom:0;left:-42%;width:28%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent);transform:skewX(-20deg);transition:transform .55s ease;pointer-events:none}
.pixel-course:hover .pixel-enter::before{transform:translateX(600%) skewX(-20deg)}
.pixel-enter img{transition:transform .24s cubic-bezier(.2,.75,.25,1)}
.pixel-course:hover .pixel-enter img{transform:translateX(5px)}

@media(prefers-reduced-motion:reduce){
  body::before,.pixel-brand,.pixel-hero-copy,.pixel-hero-art,.pixel-course,.pixel-course::after,.pixel-footer{animation:none!important}
  .pixel-course,.pixel-enter,.pixel-enter::before,.pixel-enter img{transition:none!important}
  .pixel-course:hover,.pixel-course:active{transform:none;box-shadow:8px 8px 0 var(--shadow)}
}


/* Layered motion: clearer cues, while keeping the existing pixel artwork. */
@keyframes pixel-float {
  0%,100% { translate:0 0; rotate:-1deg }
  50% { translate:0 -12px; rotate:1.5deg }
}
@keyframes pixel-logo-nod {
  0% { transform:rotate(0) scale(.9) }
  42% { transform:rotate(-8deg) scale(1.06) }
  72% { transform:rotate(4deg) scale(.98) }
  100% { transform:rotate(0) scale(1) }
}
@keyframes pixel-icon-intro {
  0%,100% { transform:translateY(0) }
  45% { transform:translateY(-7px) }
  70% { transform:translateY(0) }
}
@keyframes pixel-cta-signal {
  0%,78%,100% { box-shadow:5px 5px 0 var(--shadow) }
  87% { box-shadow:5px 8px 0 var(--shadow),0 0 0 4px var(--signal-color) }
}
@keyframes pixel-stripe-flow {
  0%,100% { background-position:0 0,0 0,0 0 }
  50% { background-position:0 0,8px 0,0 0 }
}
.pixel-brand-icon { transform-origin:center; animation:pixel-logo-nod .68s .2s cubic-bezier(.2,.75,.25,1) both }
.pixel-hero-art { animation-duration:4.8s; transform-origin:center; transition:transform .32s cubic-bezier(.2,.75,.25,1),filter .32s ease }
.pixel-hero-art.os-art { animation-delay:-2.4s }
.pixel-hero-art.algo-art { animation-delay:-.7s }
.pixel-hero-art:hover { transform:scale(1.06); filter:drop-shadow(8px 10px 0 rgba(50,103,205,.24)) saturate(1.12) }
.pixel-course-icon { transform-origin:center; transition:transform .3s cubic-bezier(.2,.75,.25,1) }
.pixel-course-icon img { transition:transform .3s cubic-bezier(.2,.75,.25,1) }
.pixel-course-icon { animation:pixel-icon-intro .72s .82s cubic-bezier(.2,.75,.25,1) 1 }
.pixel-course.algo .pixel-course-icon { animation-delay:1.12s }
.pixel-course:hover .pixel-course-icon,.pixel-course:focus-visible .pixel-course-icon { transform:translateY(-4px) rotate(-5deg) }
.pixel-course:hover .pixel-course-icon img,.pixel-course:focus-visible .pixel-course-icon img { transform:scale(1.1) }
.pixel-enter { --signal-color:rgba(36,93,202,.14); animation:pixel-cta-signal 6s 1s ease-in-out infinite,pixel-stripe-flow 8s linear infinite }
.pixel-course.algo .pixel-enter { --signal-color:rgba(148,80,106,.16); animation-delay:3.5s,4s }
@media(prefers-reduced-motion:reduce) {
  .pixel-brand-icon,.pixel-hero-art,.pixel-course-icon,.pixel-enter { animation:none!important; transition:none!important }
  .pixel-hero-art:hover,.pixel-hero-art:focus-visible { transform:none!important; translate:none!important; rotate:none!important }
  .pixel-course:hover .pixel-course-icon,.pixel-course:focus-visible .pixel-course-icon { transform:none!important }
  .pixel-course:hover .pixel-course-icon img,.pixel-course:focus-visible .pixel-course-icon img { transform:none!important }
}
/* Keep keyboard focus visible inside the clipped course cards. */
.pixel-course:focus-visible { box-shadow:inset 0 0 0 5px #15264b; }
.pixel-course:focus-visible .pixel-enter { outline:3px solid #fff; outline-offset:-7px; }
